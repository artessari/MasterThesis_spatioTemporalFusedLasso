project:
  type: default
  # Directory for the rendered output files
  output-dir: PDF-Documentation

execute:
  # 'freeze: auto' saves computation time by only re-rendering modified files
  freeze: auto
  # Displays the code in the final document (transparency for validation)
  echo: true
  # Hides warnings and system messages for a clean PDF output
  warning: false
  message: false
  # Disables cache to ensure full reproducibility of the data
  cache: false

format:
  pdf:
    pdf-engine: lualatex
    embed-resources: true
    # Prevents temporary .tex files and folders from cluttering the main directory
    keep-tex: false
    fontsize: 8pt
    papersize: a4
    code-block-font-size: \tiny
    geometry:
      - margin=15mm
      - bottom=20mm
      - footskip=10mm
    # LaTeX configuration for special formatting (e.g., landscape orientation)
    header-includes:
      - \usepackage{pdflscape}
      - \newcommand{\blandscape}{\begin{landscape}}
      - \newcommand{\elandscape}{\end{landscape}}
      - \usepackage{fancyhdr}
      - \usepackage{tikz}
      - |
        % Definition of a special page style for landscape pages with rotated page numbers
        \fancypagestyle{landscapestyle}{
          \fancyhf{}
          \renewcommand{\headrulewidth}{0pt}
          \fancyfoot[C]{
            \begin{tikzpicture}[remember picture,overlay]
              \node[rotate=90, xshift=0cm, yshift=0cm] at (current page.east) [yshift=10mm] {\thepage};
            \end{tikzpicture}
          }
        }
      - \usepackage{titling}
      - \setlength{\droptitle}{-1cm}
      - |
        % Formatting the title and adjusting spacing
        \pretitle{\begin{center}\LARGE\bfseries}
        \posttitle{\end{center}\vspace{-1.5cm}}

editor: visual
editor_options: 
  chunk_output_type: inline